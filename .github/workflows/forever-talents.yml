# Keeps the WoW Forever talent table in Conditional_Forever.lua in sync with wowsims/forever.
#
# On pull requests it checks the committed table against the sim's presets. On a schedule it
# regenerates the table from the sim's latest talent trees, checks it, and opens a PR if it changed.
name: Forever talents

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - Conditional_Forever.lua
      - tools/gen_forever_talents.py
      - tools/forever_talents_test/**
      - .github/workflows/forever-talents.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Clone wowsims/forever talent trees and presets
        uses: actions/checkout@v4
        with:
          repository: wowsims/forever
          path: .forever
          sparse-checkout: |
            ui/sim/talents/trees
            ui/specs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate talent table
        if: github.event_name != 'pull_request'
        run: python3 tools/gen_forever_talents.py .forever

      - name: Check export against the sim's presets
        run: |
          npm ci --prefix tools/forever_talents_test
          node tools/forever_talents_test/test.js .forever

      - name: Open PR with the updated table
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: Conditional_Forever.lua
          branch: chore/sync-forever-talents
          delete-branch: true
          commit-message: 'chore: sync Forever talent table with wowsims/forever'
          title: 'chore: sync Forever talent table with wowsims/forever'
          body: |
            The talent trees in wowsims/forever changed, so `tools/gen_forever_talents.py` regenerated the talent table in `Conditional_Forever.lua`. The export was checked against every preset talent string in the sim.

            🤖 Generated by the Forever talents workflow
