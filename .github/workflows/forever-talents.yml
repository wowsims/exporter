# Keeps the WoW Forever talent table in Flavors/Forever/Talents.lua in sync with wowsims/forever.
#
# On pull requests it checks the committed table against the sim's presets. On a schedule it
# regenerates the table from the sim's latest talent trees, checks it, and opens and merges a PR if
# it changed.
name: Forever talents

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - Flavors/Forever/Talents.lua
      - tools/gen_forever_talents.py
      - tools/test/**
      - .github/workflows/forever-talents.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Clone wowsims/forever talent trees and presets
        uses: actions/checkout@v4
        with:
          repository: wowsims/forever
          path: .forever
          sparse-checkout: |
            ui/sim/talents/trees
            ui/specs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate talent table
        if: github.event_name != 'pull_request'
        run: python3 tools/gen_forever_talents.py .forever

      - name: Check export against the sim's presets
        run: |
          npm ci --prefix tools/test
          node tools/test/forever_talents.js .forever

      # The sync PR is opened and merged with the workflow token, which starts no other workflows, so
      # the Tests workflow never sees it. Run the export snapshots here before merging instead.
      - name: Check export snapshots
        run: node tools/test/snapshots.js

      - name: Open PR with the updated table
        id: pr
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: Flavors/Forever/Talents.lua
          branch: chore/sync-forever-talents
          delete-branch: true
          commit-message: 'chore: sync Forever talent table with wowsims/forever'
          title: 'chore: sync Forever talent table with wowsims/forever'
          body: |
            The talent trees in wowsims/forever changed, so `tools/gen_forever_talents.py` regenerated the talent table in `Flavors/Forever/Talents.lua`. The export was checked against every preset talent string in the sim, so this PR merges itself.

            🤖 Generated by the Forever talents workflow

      # The preset test above already passed on exactly this table, so the PR is merged without
      # waiting for review. A release still needs someone to push a tag.
      - name: Merge the PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --repo ${{ github.repository }} --squash --delete-branch
