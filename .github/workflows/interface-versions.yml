# Adds the current interface number of each supported game flavor to WowSimsExporter.toc, so a
# game patch doesn't leave the addon marked out of date. Opens a PR for review rather than merging:
# a new number tells players the addon works on that client, which only in-game testing can confirm.
name: Interface versions

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Add missing interface numbers
        id: update
        run: |
          {
            echo 'summary<<EOF'
            python3 tools/update_interface_versions.py
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open PR with the new interface numbers
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: WowSimsExporter.toc
          branch: chore/interface-versions
          delete-branch: true
          commit-message: 'chore: add new game client interface numbers'
          title: 'chore: add new game client interface numbers'
          body: |
            Blizzard's version service lists new client builds for supported flavors.

            ${{ steps.update.outputs.summary }}

            Before merging, check that the addon loads and exports on each new client.

            🤖 Generated by the Interface versions workflow
